name: Keep Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          curl -sf https://elix-ai-9pz0.onrender.com/ || echo "Ping failed — Render may already be waking up, this is non-fatal"